[project]
name = "kg-grounded-qa"
version = "0.1.0"
description = "Multi-hop QA over a code knowledge graph with GNN-ranked retrieval and grounded local-LLM generation"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
